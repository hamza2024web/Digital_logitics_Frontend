<div class="page-container">
    <div class="form-card">
        <div class="card-header">
            <h2>{{ isEditing ? 'Edit' : 'New' }} Purchase Order</h2>
            <button class="close-btn" (click)="cancel()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form [formGroup]="purchaseOrderForm" (ngSubmit)="onSubmit()">
            <!-- Main Info Section -->
            <div class="form-section">
                <h3>Order Information</h3>
                <div class="form-row">
                    <!-- Supplier Select -->
                    <div class="form-group">
                        <label>Supplier</label>
                        <select formControlName="supplierId">
                            <option value="" disabled>Select Supplier</option>
                            @for (supplier of suppliers; track supplier.id) {
                                <option [value]="supplier.id">{{ supplier.name }}</option>
                            }
                        </select>
                    </div>

                    <!-- Warehouse Select -->
                    <div class="form-group">
                        <label>Delivery Warehouse</label>
                        <select formControlName="warehouseId">
                            <option value="" disabled>Select Warehouse</option>
                            @for (warehouse of warehouses; track warehouse.id) {
                                <option [value]="warehouse.id">{{ warehouse.name }}</option>
                            }
                        </select>
                    </div>

                    <!-- Date Picker -->
                    <div class="form-group">
                        <label>Expected Date</label>
                        <input type="date" formControlName="expectedDate">
                    </div>
                </div>
            </div>

            <!-- Items Section -->
            <div class="form-section">
                <div class="section-header">
                    <h3>Order Items</h3>
                    <button type="button" class="btn-secondary" (click)="addItem()">
                        <i class="fas fa-plus"></i> Add Item
                    </button>
                </div>
                
                <div class="items-list" formArrayName="items">
                    @for (item of items.controls; track $index) {
                    <div class="item-row" [formGroupName]="$index">
                        <div class="form-group product-select">
                            <label *ngIf="$index === 0">Product</label>
                            <select formControlName="productId">
                                <option value="" disabled>Select Product</option>
                                @for (product of products; track product.id) {
                                    <option [value]="product.id">{{ product.name }}</option>
                                }
                            </select>
                        </div>

                        <div class="form-group small">
                            <label *ngIf="$index === 0">Qty</label>
                            <input type="number" formControlName="quantity" min="1">
                        </div>

                        <div class="form-group small">
                            <label *ngIf="$index === 0">Price</label>
                            <input type="number" formControlName="unitPrice" min="0">
                        </div>

                        <div class="form-group total-display">
                            <label *ngIf="$index === 0">Total</label>
                            <div class="calculated-price">
                                {{ (item.get('quantity')?.value * item.get('unitPrice')?.value) || 0 | currency }}
                            </div>
                        </div>

                        <button type="button" class="remove-btn" (click)="removeItem($index)" 
                                [style.marginTop]="$index === 0 ? '24px' : '0'">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    }
                </div>
                
                <div class="order-total">
                    <span>Total Amount:</span>
                    <span class="amount">{{ calculateTotal() | currency }}</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="form-actions">
                <button type="button" class="btn-text" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn-primary" [disabled]="purchaseOrderForm.invalid">
                    <i class="fas fa-save"></i> Save Order
                </button>
            </div>
        </form>
    </div>
</div>
