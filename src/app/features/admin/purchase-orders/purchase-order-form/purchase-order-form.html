<div class="page-container">
    <div class="page-header">
        <div class="header-content">
            <h1>New Purchase Order</h1>
            <p>Create a new purchase order for suppliers</p>
        </div>
    </div>

    <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
        <div class="content-grid">
            <!-- Main Form -->
            <div class="main-column">
                <div class="card">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Supplier</label>
                            <select formControlName="supplierId" class="form-control"
                                [class.error]="hasFieldError('supplierId')">
                                <option [ngValue]="null">Select Supplier</option>
                                @for (supplier of suppliers; track supplier.id) {
                                <option [ngValue]="supplier.id">{{ supplier.name }} {{ supplier.contactPerson ? '(' +
                                    supplier.contactPerson + ')' : '' }}</option>
                                }
                            </select>
                            <div class="error-text" *ngIf="hasFieldError('supplierId')">{{ getFieldError('supplierId')
                                }}</div>
                        </div>

                        <div class="form-group">
                            <label>Destination Warehouse</label>
                            <select formControlName="destinationWarehouseId" class="form-control"
                                [class.error]="hasFieldError('destinationWarehouseId')">
                                <option [ngValue]="null">Select Warehouse</option>
                                @for (warehouse of warehouses; track warehouse.id) {
                                <option [ngValue]="warehouse.id">{{ warehouse.name }} ({{ warehouse.code }})</option>
                                }
                            </select>
                            <div class="error-text" *ngIf="hasFieldError('destinationWarehouseId')">{{
                                getFieldError('destinationWarehouseId') }}</div>
                        </div>
                    </div>
                </div>

                <!-- Order Lines -->
                <div class="card lines-section">
                    <div class="section-header">
                        <h3>Order Lines</h3>
                        <button type="button" class="btn-secondary" (click)="addLine()">
                            <i class="fas fa-plus"></i> Add Line
                        </button>
                    </div>

                    <div class="lines-container" formArrayName="lines">
                        @for (line of lines.controls; track $index) {
                        <div class="line-row" [formGroupName]="$index">
                            <div class="line-product">
                                <label>Product</label>
                                <select formControlName="productId" (change)="onProductSelected($index)">
                                    <option [ngValue]="null">Select Product</option>
                                    @for (product of products; track product.id) {
                                    <option [ngValue]="product.id">{{ product.sku }} - {{ product.name }}</option>
                                    }
                                </select>
                            </div>
                            <div class="line-qty">
                                <label>Qty</label>
                                <input type="number" formControlName="quantity" min="1">
                            </div>
                            <div class="line-price">
                                <label>Unit Price</label>
                                <input type="number" formControlName="price" min="0" step="0.01">
                            </div>
                            <div class="line-total">
                                <label>Total</label>
                                <div class="total-value">{{ getLineTotal($index) | currency }}</div>
                            </div>
                            <button type="button" class="remove-btn" (click)="removeLine($index)">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        }
                    </div>

                    <div class="order-summary">
                        <div class="summary-row total">
                            <span>Grand Total</span>
                            <span class="amount">{{ getGrandTotal() | currency }}</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="form-actions">
                <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn-primary" [disabled]="orderForm.invalid || isLoading">
                    <span *ngIf="isLoading" class="spinner"></span>
                    Create Order
                </button>
            </div>
        </div>
    </form>
</div>
