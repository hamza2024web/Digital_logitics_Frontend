<div class="login-container">
  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <h1>Digital Logistics</h1>
      <p>Plateforme de Gestion Logistique</p>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <!-- Message d'erreur global -->
      <div *ngIf="errorMessage" class="alert alert-error">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Champ Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="votre. email@exemple.com"
          [class.invalid]="email?. invalid && email?.touched"
        />

        <!-- Messages d'erreur email -->
        <div *ngIf="email?.invalid && email?. touched" class="error-message">
          <small *ngIf="email?.errors?.['required']">
            L'email est requis
          </small>
          <small *ngIf="email?.errors?.['email']">
            Format d'email invalide
          </small>
        </div>
      </div>

      <!-- Champ Mot de passe -->
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="••••••••"
          [class.invalid]="password?.invalid && password?.touched"
        />

        <!-- Messages d'erreur password -->
        <div *ngIf="password?.invalid && password?.touched" class="error-message">
          <small *ngIf="password?.errors?.['required']">
            Le mot de passe est requis
          </small>
          <small *ngIf="password?.errors?.['minlength']">
            Minimum 6 caractères
          </small>
        </div>
      </div>

      <!-- Bouton de connexion -->
      <button
        type="submit"
        class="btn-primary"
        [disabled]="isLoading"
      >
        <span *ngIf="! isLoading">Se connecter</span>
        <span *ngIf="isLoading" class="loader">
          <svg class="spinner" viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
          </svg>
          Connexion en cours...
        </span>
      </button>

      <!-- Lien vers register -->
      <div class="register-link">
        <p>Pas encore de compte ?
          <a routerLink="/register" class="link">S'inscrire</a>
        </p>
      </div>

    </form>

    <!-- Séparateur -->
    <div class="divider">
      <span>Comptes de test</span>
    </div>

    <!-- Boutons de test -->
    <div class="test-accounts">
      <button
        type="button"
        class="btn-test btn-admin"
        (click)="fillTestCredentials('admin')"
        [disabled]="isLoading"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <polyline points="16 11 18 13 22 9"></polyline>
        </svg>
        Admin
      </button>

      <button
        type="button"
        class="btn-test btn-warehouse"
        (click)="fillTestCredentials('warehouse')"
        [disabled]="isLoading"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Warehouse
      </button>

      <button
        type="button"
        class="btn-test btn-client"
        (click)="fillTestCredentials('client')"
        [disabled]="isLoading"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Client
      </button>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p>&copy; 2026 Digital Logistics Platform</p>
    </div>
  </div>
</div>
