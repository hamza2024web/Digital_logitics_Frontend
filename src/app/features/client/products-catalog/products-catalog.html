<div class="container">
  <!-- 1. HEADER & FILTERS -->
  <div class="filters-section">
    <div class="search-box">
      <input type="text"
             placeholder="Recherche par SKU ou Nom..."
             (input)="onSearch($event)"
             [value]="(query$ | async)?.search || ''">
    </div>

    <div class="selectors">
      <!-- Category Filter -->
      <select (change)="onCategoryChange($event)">
        <option value="">Toutes les catégories</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>

      <!-- Page Size -->
      <select (change)="onSizeChange($event)">
        <option [value]="10">10 par page</option>
        <option [value]="20">20 par page</option>
        <option [value]="50">50 par page</option>
      </select>
    </div>
  </div>

  <!-- 2. LOADING STATE -->
  <div *ngIf="loading$ | async" class="loading-overlay">
    <div class="spinner">Chargement...</div>
  </div>

  <!-- 3. ERROR STATE -->
  <div *ngIf="error$ | async as error" class="error-message">
    <p>Une erreur est survenue : {{ error.message }}</p>
  </div>

  <!-- 4. PRODUCTS TABLE -->
  <div class="table-responsive" *ngIf="!(loading$ | async) && (products$ | async) as products">
    <table>
      <thead>
      <tr>
        <th (click)="onSort('sku')">SKU</th>
        <th (click)="onSort('name')">Nom</th>
        <th (click)="onSort('category')">Catégorie</th>
        <th (click)="onSort('price')">Prix</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let p of products">
        <td>{{ p.sku }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.category }}</td>
        <td>{{ p.price | currency:'EUR' }}</td>
        <td>
          <button class="btn-view" [routerLink]="['/client/products', p.id]">View</button>
        </td>
      </tr>
      </tbody>
    </table>

    <!-- Empty State -->
    <div *ngIf="products.length === 0" class="empty-state">
      Aucun produit trouvé.
    </div>
  </div>

  <!-- 5. PAGINATION CONTROLS -->
  <div class="pagination" *ngIf="(query$ | async) as q">
    <ng-container *ngIf="(totalPages$ | async) as total">

      <button [disabled]="q.page === 0" (click)="onPageChange(q.page - 1)">
        Précédent
      </button>

      <span>Page {{ q.page + 1 }} sur {{ total }}</span>
      <button [disabled]="total <= q.page + 1"
              (click)="onPageChange(q.page + 1)">
        Suivant
      </button>
    </ng-container>
  </div>
</div>
