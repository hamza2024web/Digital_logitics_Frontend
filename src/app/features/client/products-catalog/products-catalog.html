<div class="catalog-page">
    <div class="page-header">
        <div class="header-content">
            <h1>Catalogue Produits</h1>
            <p>Parcourez notre sélection de produits disponibles</p>
        </div>
        <div class="header-actions">
            <div class="search-box">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" placeholder="Rechercher par nom ou SKU..." [value]="searchTerm"
                    (input)="onSearch($event)">
            </div>
            <div class="sort-box">
                <select (change)="onSort($event)" [value]="sortBy">
                    <option value="name">Nom (A-Z)</option>
                    <option value="price-asc">Prix (Croissant)</option>
                    <option value="price-desc">Prix (Décroissant)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="catalog-content">
        <div class="loading-state" *ngIf="isLoading">
            <div class="spinner"></div>
            <p>Chargement du catalogue...</p>
        </div>

        <div class="error-state" *ngIf="errorMessage">
            <p>{{ errorMessage }}</p>
            <button (click)="loadProducts()">Réessayer</button>
        </div>

        <div class="empty-state" *ngIf="!isLoading && !errorMessage && filteredProducts.length === 0">
            <div class="empty-icon">🔍</div>
            <h3>Aucun produit trouvé</h3>
            <p>Essayez de modifier vos critères de recherche.</p>
            <button class="btn-primary" (click)="resetFilters()">Tout afficher</button>
        </div>

        <div class="products-grid" *ngIf="!isLoading && filteredProducts.length > 0">
            <div class="product-card" *ngFor="let product of filteredProducts">
                <div class="product-image">
                    <img [src]="product.image || 'assets/images/placeholder-product.png'" [alt]="product.name"
                        (error)="$event.target.src='assets/images/placeholder-product.png'">
                </div>
                <div class="card-body">
                    <div class="product-header">
                        <h3 class="product-name" [title]="product.name">{{ product.name }}</h3>
                        <span class="product-sku">SKU: {{ product.sku }}</span>
                    </div>
                    <div class="product-price">
                        {{ formatPrice(product.price) }}
                    </div>
                </div>
                <div class="card-footer">
                    <a routerLink="/client/new-order" [queryParams]="{ productId: product.id }"
                        class="btn-primary full-width">
                        Commander
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
